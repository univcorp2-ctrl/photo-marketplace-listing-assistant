name: Pages production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production-smoke
  cancel-in-progress: true

jobs:
  http-200:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production site returns HTTP 200
        env:
          URL: https://photo-marketplace-listing-assistant.pages.dev/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl --location --silent --show-error --output /tmp/page.html --write-out '%{http_code}' "$URL" || true)
            echo "attempt=$attempt status=$code"
            if [ "$code" = "200" ]; then
              grep -q "Photo Listing Assistant" /tmp/page.html
              echo "Production URL is healthy: HTTP 200"
              exit 0
            fi
            sleep 10
          done
          echo "Production URL did not return HTTP 200"
          cat /tmp/page.html 2>/dev/null || true
          exit 1
